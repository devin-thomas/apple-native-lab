        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: $(LAB_PURPOSE_SPEECH_RECOGNITION)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: $(LAB_PURPOSE_NEARBY_INTERACTION)
        INFOPLIST_KEY_NSFaceIDUsageDescription: $(LAB_PURPOSE_FACE_ID)

  # Companions: the Watch host installs directly to a paired Watch; it is not embedded in
  # the iPhone app yet, so CoreLocal never depends on Watch provisioning.
  LabWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Apps/Watch
      - Apps/Icon
    dependencies:
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
      # LAB-030 Tactile Grammar: Watch system haptics only. No custom waveform.
      - package: LabFeatures
        product: TactileGrammar
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(LAB_BUNDLE_PREFIX).nativelab
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
    settings:
      base:
        PRODUCT_NAME: NativeLabWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.watchkitapp
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: $(LAB_PURPOSE_NEARBY_INTERACTION)

  # Companions: the Apple TV host (CORE-013). It installs directly to a paired Apple TV. It uses the
  # iPhone host's bundle identifier, as one universal purchase, so a signing team registers no new
  # App ID for it; the TV and iPhone apps never share a device, so the two never collide. It links
  # LabSupport and LabCatalog, which compile FoundationModels and Speech out of tvOS, the Screening
  # Room products (LAB-031), and LAB-019's session layer, network adapter, and show, and it declares
  # no entitlement. Its icon is the layered tvOS brand asset script/make_app_icon.py draws
  # from the same geometry as Apps/Icon, which Icon Composer does not produce for tvOS.
  LabTV:
    type: application
    platform: tvOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Apps/TV
    dependencies:
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
      # LAB-031 Native Screening Room: the one experiment module this host runs.
      - package: LabFeatures
        product: ScreeningRoom
      - package: LabFeatures
        product: ScreeningRoomPlayback
      # LAB-019 Local Constellation: the TV is the display, live on the local network or in the
      # single-device simulation. The first experiment module on Apple TV.
      - package: LabFeatures
        product: PeerSession
      - package: LabFeatures
        product: PeerSessionNetwork
      - package: LabFeatures
        product: LocalConstellation
    info:
      path: Apps/TV/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # LAB-031: the playback audio session, for Picture in Picture and background audio.
        UIBackgroundModes: [audio]
        # LAB-019: browsing for a conductor. The system asks only when a person chooses Join.
        NSLocalNetworkUsageDescription: Native Lab looks for a Local Constellation conductor on your local network only when you choose to join one.
        NSBonjourServices: [_nativelab-lc._tcp]
    settings:
      base:
        PRODUCT_NAME: NativeLabTV
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "3"
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        # LAB-031 links AVFoundation for playback; Config/ProductPolicy.txt asks a Store build that
        # links it for these two strings. The screening never uses the camera or microphone.
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)

  LabMacTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Profiles/CoreLocal.xcconfig
      Release: Config/Profiles/CoreLocal.xcconfig
    sources:
      - Tests/LabMacTests
    dependencies:
      - target: LabMac
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
      - package: LabFeatures
        product: ScreeningRoom
      - package: LabFeatures
        product: ScreeningRoomPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeLab.app/Contents/MacOS/NativeLab
        BUNDLE_LOADER: $(TEST_HOST)
        DEVELOPMENT_TEAM: $(LAB_MAC_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES

  # Smoke tests that run inside each device host (CORE-013), as LabMacTests does for the Mac: the
  # catalog is in the bundle, the build records its provenance, and the readiness probes run
  # without a prompt. script/test.sh runs them in simulators it creates; they never need a team.
  LabPhoneTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Profiles/CoreLocal.xcconfig
      Release: Config/Profiles/CoreLocal.xcconfig
    sources:
      - Tests/LabPhoneTests
    dependencies:
      - target: LabPhone
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
      - package: LabFeatures
        product: ScreeningRoom
      - package: LabFeatures
        product: ScreeningRoomPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.phonetests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeLab.app/NativeLab
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  LabWatchTests:
    type: bundle.unit-test
    platform: watchOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Tests/LabWatchTests
    dependencies:
      - target: LabWatch
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.watchtests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeLabWatch.app/NativeLabWatch
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

  LabTVTests:
    type: bundle.unit-test
    platform: tvOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Tests/LabTVTests
    dependencies:
      - target: LabTV
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
      - package: LabFeatures
        product: ScreeningRoom
      - package: LabFeatures
        product: ScreeningRoomPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.tvtests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeLabTV.app/NativeLabTV
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES

  # The Apple TV host driven with the Siri Remote alone (XCUIRemote): focus reaches the catalog, an
  # experiment's detail, and Readiness, and Menu always leads back, finally to the Home screen.
  LabTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Tests/LabTVUITests
    dependencies:
      - target: LabTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.tvuitests
        TEST_TARGET_NAME: LabTV
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LabMac-Core:
    build:
      targets:
        LabMac: all
        LabMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LabMacTests
    archive:
      config: Release

  LabPhone-Core:
    build:
      targets:
        LabPhone: all
        LabPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LabPhoneTests
    archive:
      config: Release

  LabPhone-Surfaces:
    build:
      targets:
        LabPhoneSurfaces: all
        ShareExtension: all
        SurfaceWidgets: all
        QuickLookPreview: all
        AudioWorkshopUnit: all
    # The app runs, not an extension: build targets are listed alphabetically, and
    # AudioWorkshopUnit would otherwise come first.
    run:
      config: Debug
      executable: LabPhoneSurfaces
    archive:
      config: Release

  LabMac-Companions:
    build:
      targets:
        LabMacCompanions: all
    run:
      config: Debug
    archive:
      config: Release

  LabPhone-Companions:
    build:
      targets:
        LabPhoneCompanions: all
    run:
      config: Debug
    archive:
      config: Release

  LabWatch:
    build:
      targets:
        LabWatch: all
        LabWatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LabWatchTests
        - package: LabSupport/LabSupportTests
        - package: LabFeatures/LabCatalogTests
    archive:
      config: Release

  LabTV:
    build:
      targets:
        LabTV: all
        LabTVTests: [test]
        LabTVUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Only the named screenshots the remote test attaches; no automatic screen captures.
      captureScreenshotsAutomatically: false
      targets:
        - LabTVTests
        - LabTVUITests
        - package: LabSupport/LabSupportTests
        - package: LabFeatures/LabCatalogTests
        # LAB-031: the screening's rules and its tvOS adapters, in the tvOS simulator.
        - package: LabFeatures/ScreeningRoomTests
        - package: LabFeatures/ScreeningRoomPlaybackTests
    archive:
      config: Release
