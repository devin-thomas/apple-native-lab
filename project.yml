# Source of truth for AppleNativeLab.xcodeproj. Regenerate with script/generate_project.sh.
# Sources use synchronized folders: add Swift files without regenerating.
#
# Build profiles (docs/BUILD_AND_DISTRIBUTION.md): every target attaches exactly one
# Config/Profiles/<Profile>.xcconfig through `configFiles`, which sets LAB_BUILD_PROFILE and the
# profile's compilation condition. Schemes by profile:
#   CoreLocal         LabMac-Core, LabPhone-Core
#   Companions        LabWatch, LabTV, LabMac-Companions, LabPhone-Companions (host variants with the LAN adapter)
#   SystemSurfaces    LabPhone-Surfaces (the host variant, the share extension, the widget and Control extension, the Quick Look preview, the AUv3 extension)
#   CloudOptional     none yet
#   FrontierOptional  none yet (LAB-009 File Provider sources live under Extensions/DocumentsProvider/; host wiring waits on qualification)
# Entitlements and purpose strings are declared per executable, on the target that uses them.
# Every host scheme's test action runs a smoke test inside that host (script/test.sh). The LabWatch
# and LabTV test actions also run the LabSupport and LabCatalog package tests on their platform, and
# LabTV also runs the Screening Room package tests (LAB-031).
name: AppleNativeLab

options:
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
    tvOS: "26.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  LabSupport:
    path: Packages/LabSupport
  LabDomain:
    path: Packages/LabDomain
  LabStore:
    path: Packages/LabStore
  LabFeatures:
    path: Packages/LabFeatures

targets:
  # CoreLocal: the Mac host. Signs to run locally by default; sandboxed.
  LabMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Profiles/CoreLocal.xcconfig
      Release: Config/Profiles/CoreLocal.xcconfig
    sources:
      - Apps/Shared
      - Apps/Mac
      - Apps/Icon
      # The demo seed, bundled as data. Reset Demo commits it through the operation service.
      - path: Fixtures/demo/seed.json
        buildPhase: resources
      # LAB-010 Typed Local Intelligence: the original fixture notes, bundled as data.
      - path: Fixtures/intelligence/intelligence-ambiguous-note.txt
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-injected-note.txt
        buildPhase: resources
      # LAB-012 Point, Inspect, Propose: the original swatch, bundled as data.
      - path: Fixtures/point-inspect/swatch-card.png
        buildPhase: resources
      # LAB-013 Speech Timeline: the sample script the device speaks, and its caption fixture.
      - path: Fixtures/speech/speech-sample-script.txt
        buildPhase: resources
      - path: Fixtures/speech/speech-sample-captions.vtt
      # LAB-011 Model Routing Observatory: original routing prompt fixture.
      - path: Fixtures/routing/routing-sample-prompt.txt
        buildPhase: resources
    dependencies:
      - package: LabSupport
      - package: LabDomain
      - package: LabStore
      - package: LabFeatures
        product: LabCatalog
      # LAB-001 Action Atlas: App Intents from a package target; their metadata is extracted into the app.
      - package: LabFeatures
        product: ActionAtlas
      # LAB-010 Typed Local Intelligence: typed proposals, the sample parser, and the Foundation Models extractor.
      - package: LabFeatures
        product: TypedIntelligence
      # LAB-012 Point, Inspect, Propose: a chosen image, OCR, and a reviewable record.
      - package: LabFeatures
        product: PointInspect
      # LAB-011 Model Routing Observatory: route policy, PCC eligibility, outgoing-field preview.
      - package: LabFeatures
        product: ModelRouting
      # LAB-035 Access as a Superpower: the task, its chart semantics, and the Audio Graph descriptor.
      - package: LabFeatures
        product: AccessSuperpower
      # LAB-038 Wallet Moment: unsigned pass preview, sample event card, signing boundary (no PassKit link).
      - package: LabFeatures
        product: WalletMoment
      # LAB-007 Share Ingress Station: the share inbox and its paste and file-picker fallbacks.
      - package: LabFeatures
        product: ShareIngress
      # LAB-008 Portable Objects: the .anlab document, its Transferable representations, and staged imports.
      - package: LabFeatures
        product: PortableObjects
      # LAB-016 Pick Up Here: continuation hints. Handoff carries an identifier and a section.
      - package: LabFeatures
        product: PickUpHere
      # LAB-009 Documents Everywhere: sample catalog, previews, and provider lifecycle (provider disabled).
      - package: LabFeatures
        product: DocumentsEverywhere
      # LAB-004 Surface Deck: the demo session's deck, its intents, and the in-app widget previews.
      - package: LabFeatures
        product: SurfaceDeck
      # LAB-042 Desktop Native Power: Mac command palette, documents, and the allowlisted intent.
      - package: LabFeatures
        product: DesktopNativePower
      # LAB-041 Trust Desk: local authorization, a scoped keychain record, and a passkey simulation.
      - package: LabFeatures
        product: TrustDesk
      # LAB-002 Context Cards: the visible sample, the schema gate, and the set-aside intents.
      - package: LabFeatures
        product: ContextCards
      # LAB-015 Local Model Bench: the fixture executor. It does not link Core ML.
      - package: LabFeatures
        product: LocalModelBench
      # LAB-017 Durable Sync Ledger: the write-ahead ledger, the file profile, and the manual document.
      - package: LabFeatures
        product: DurableSyncLedger
      # LAB-030 Tactile Grammar: the cues, their fallback, and Play Tactile Cue.
      - package: LabFeatures
        product: TactileGrammar
      # LAB-043 Respectful Attention: the agenda, its intents, and lab-owned alerts.
      - package: LabFeatures
        product: RespectfulAttention
      # LAB-013 Speech Timeline: the timeline, caption import and export, the save operation, and the on-device adapters.
      - package: LabFeatures
        product: SpeechTimeline
      # LAB-006 Find the Thing: opted-in search, citations, and this app's indexed records.
      - package: LabFeatures
        product: FindTheThing
      # LAB-003 Shortcut Workbench: curated App Shortcuts, recipes, and the manual fallback.
      - package: LabFeatures
        product: ShortcutWorkbench
      # LAB-032 Render That Survives: the reusable job runtime and the render module.
      - package: LabFeatures
        product: LabJobs
      - package: LabFeatures
        product: RenderThatSurvives
      # LAB-031 Native Screening Room: the playback session and its AVFoundation, AVKit, and Now Playing adapters, with the original clips.
      - package: LabFeatures
        product: ScreeningRoom
      - package: LabFeatures
        product: ScreeningRoomPlayback
      # LAB-029 Audio Workshop: the C kernel, live playback, MIDI, offline processing, and the audio unit.
      - package: LabFeatures
        product: AudioWorkshop
      # LAB-023 Tabletop Reality: the kit, placement rules, tracking gate, and anchor operations.
      - package: LabFeatures
        product: TabletopReality
      # LAB-019 Local Constellation: the session layer and the single-device simulation. No network
      # adapter: CoreLocal links no network framework and carries no network entitlement.
      - package: LabFeatures
        product: PeerSession
      - package: LabFeatures
        product: LocalConstellation
      # LAB-037 Home Scene Sandbox: fictional home preview and selected light commits.
      - package: LabFeatures
        product: HomeSceneSandbox
      # LAB-040 Commerce Without Tricks: local product fixtures and transaction-state simulator.
      - package: LabFeatures
        product: CommerceWithoutTricks
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleName: Native Lab
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        # LAB-008: the lab object type, named from the bundle prefix. Code reads the key, never the prefix.
        LabObjectTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
        # LAB-042: Services menu item for selected text. The handler imports the string; it does not run it.
        NSServices:
          - NSMenuItem:
              default: Import Selected Text into Native Lab
            NSMessage: importSelectedText
            NSPortName: Native Lab
            NSSendTypes:
              - public.utf8-plain-text
        # LAB-002: the activity type for the sample on screen. Code reads the key, never the prefix.
        LabContextCardsActivityType: $(LAB_BUNDLE_PREFIX).nativelab.context-cards.visible-sample
        # The system delivers an activity type only if it is listed. No entitlement.
        # LAB-016: pick-up-here. LAB-002: the visible sample.
        NSUserActivityTypes:
          - nativelab.pick-up-here
          - $(LAB_BUNDLE_PREFIX).nativelab.context-cards.visible-sample
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
            UTTypeDescription: Native Lab Object
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [anlab]
    # The project's only entitlements. Capability entitlements join the executable that uses them.
    entitlements:
      path: Apps/Mac/LabMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # LAB-008: the Import and Export file dialogs, the declared fallback. Without it the sandbox
        # refuses to show the open and save panels. Access covers only the file a person picks.
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_NAME: NativeLab
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(LAB_MAC_DEVELOPMENT_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: $(LAB_PURPOSE_SPEECH_RECOGNITION)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSFaceIDUsageDescription: $(LAB_PURPOSE_FACE_ID)

  # CoreLocal: the iPhone and iPad host. It embeds no extension: a SystemSurfaces host variant
  # with its own scheme embeds extensions, so LabPhone-Core never needs their provisioning.
  LabPhone:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Profiles/CoreLocal.xcconfig
      Release: Config/Profiles/CoreLocal.xcconfig
    sources:
      - Apps/Shared
      - Apps/Phone
      - Apps/Icon
      # The demo seed, bundled as data. Reset Demo commits it through the operation service.
      - path: Fixtures/demo/seed.json
        buildPhase: resources
      # LAB-010 Typed Local Intelligence: the original fixture notes, bundled as data.
      - path: Fixtures/intelligence/intelligence-ambiguous-note.txt
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-injected-note.txt
        buildPhase: resources
      # LAB-012 Point, Inspect, Propose: the original swatch, bundled as data.
      - path: Fixtures/point-inspect/swatch-card.png
        buildPhase: resources
      # LAB-013 Speech Timeline: the sample script the device speaks, and its caption fixture.
      - path: Fixtures/speech/speech-sample-script.txt
        buildPhase: resources
      - path: Fixtures/speech/speech-sample-captions.vtt
      # LAB-011 Model Routing Observatory: original routing prompt fixture.
      - path: Fixtures/routing/routing-sample-prompt.txt
        buildPhase: resources
    dependencies:
      - package: LabSupport
      - package: LabDomain
      - package: LabStore
      - package: LabFeatures
        product: LabCatalog
      # LAB-001 Action Atlas: App Intents from a package target; their metadata is extracted into the app.
      - package: LabFeatures
        product: ActionAtlas
      # LAB-010 Typed Local Intelligence: typed proposals, the sample parser, and the Foundation Models extractor.
      - package: LabFeatures
        product: TypedIntelligence
      # LAB-012 Point, Inspect, Propose: a chosen image, OCR, and a reviewable record.
      - package: LabFeatures
        product: PointInspect
      # LAB-011 Model Routing Observatory: route policy, PCC eligibility, outgoing-field preview.
      - package: LabFeatures
        product: ModelRouting
      # LAB-035 Access as a Superpower: the task, its chart semantics, and the Audio Graph descriptor.
      - package: LabFeatures
        product: AccessSuperpower
      # LAB-038 Wallet Moment: unsigned pass preview, sample event card, signing boundary (no PassKit link).
      - package: LabFeatures
        product: WalletMoment
      # LAB-007 Share Ingress Station: the share inbox and its paste and file-picker fallbacks.
      - package: LabFeatures
        product: ShareIngress
      # LAB-008 Portable Objects: the .anlab document, its Transferable representations, and staged imports.
      - package: LabFeatures
        product: PortableObjects
      # LAB-016 Pick Up Here: continuation hints. Handoff carries an identifier and a section.
      - package: LabFeatures
        product: PickUpHere
      # LAB-009 Documents Everywhere: sample catalog, previews, and provider lifecycle (provider disabled).
      - package: LabFeatures
        product: DocumentsEverywhere
      # LAB-004 Surface Deck: the demo session's deck, its intents, and the in-app widget previews.
      - package: LabFeatures
        product: SurfaceDeck
      # LAB-041 Trust Desk: local authorization, a scoped keychain record, and a passkey simulation.
      - package: LabFeatures
        product: TrustDesk
      # LAB-002 Context Cards: the visible sample, the schema gate, and the set-aside intents.
      - package: LabFeatures
        product: ContextCards
      # LAB-015 Local Model Bench: the fixture executor. It does not link Core ML.
      - package: LabFeatures
        product: LocalModelBench
      # LAB-017 Durable Sync Ledger: the write-ahead ledger, the file profile, and the manual document.
      - package: LabFeatures
        product: DurableSyncLedger
      # LAB-030 Tactile Grammar: the cues, their fallback, and Play Tactile Cue.
      - package: LabFeatures
        product: TactileGrammar
      # LAB-043 Respectful Attention: the agenda, its intents, and lab-owned alerts.
      - package: LabFeatures
        product: RespectfulAttention
      # LAB-013 Speech Timeline: the timeline, caption import and export, the save operation, and the on-device adapters.
      - package: LabFeatures
        product: SpeechTimeline
      # LAB-006 Find the Thing: opted-in search, citations, and this app's indexed records.
      - package: LabFeatures
        product: FindTheThing
      # LAB-003 Shortcut Workbench: curated App Shortcuts, recipes, and the manual fallback.
      - package: LabFeatures
        product: ShortcutWorkbench
      # LAB-032 Render That Survives: the reusable job runtime and the render module.
      - package: LabFeatures
        product: LabJobs
      - package: LabFeatures
        product: RenderThatSurvives
      # LAB-031 Native Screening Room: the playback session and its AVFoundation, AVKit, and Now Playing adapters, with the original clips.
      - package: LabFeatures
        product: ScreeningRoom
      - package: LabFeatures
        product: ScreeningRoomPlayback
      # LAB-029 Audio Workshop: the C kernel, live playback, MIDI, offline processing, and the audio unit.
      - package: LabFeatures
        product: AudioWorkshop
      # LAB-023 Tabletop Reality: the kit, placement rules, tracking gate, and anchor operations.
      - package: LabFeatures
        product: TabletopReality
      # LAB-019 Local Constellation: the session layer and the single-device simulation. No network
      # adapter: CoreLocal links no network framework and carries no network entitlement.
      - package: LabFeatures
        product: PeerSession
      - package: LabFeatures
        product: LocalConstellation
      # LAB-037 Home Scene Sandbox: fictional home preview and selected light commits.
      - package: LabFeatures
        product: HomeSceneSandbox
      # LAB-040 Commerce Without Tricks: local product fixtures and transaction-state simulator.
      - package: LabFeatures
        product: CommerceWithoutTricks
    info:
      path: Apps/Phone/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        # LAB-008: the lab object type, named from the bundle prefix. Code reads the key, never the prefix.
        LabObjectTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
        # LAB-002: the activity type for the sample on screen. Code reads the key, never the prefix.
        LabContextCardsActivityType: $(LAB_BUNDLE_PREFIX).nativelab.context-cards.visible-sample
        # The system delivers an activity type only if it is listed. No entitlement.
        # LAB-016: pick-up-here. LAB-002: the visible sample.
        NSUserActivityTypes:
          - nativelab.pick-up-here
          - $(LAB_BUNDLE_PREFIX).nativelab.context-cards.visible-sample
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
            UTTypeDescription: Native Lab Object
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [anlab]
        # LAB-032: continued processing for a render a person starts. Each request registers a new
        # identifier under this wildcard. No background mode and no background-GPU entitlement.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).render.*
        UILaunchScreen: {}
        # LAB-031: the playback audio session keeps playing in Picture in Picture and in the
        # background, which Picture in Picture on iPhone and iPad requires.
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: NativeLab
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: $(LAB_PURPOSE_SPEECH_RECOGNITION)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: $(LAB_PURPOSE_NEARBY_INTERACTION)
        INFOPLIST_KEY_NSFaceIDUsageDescription: $(LAB_PURPOSE_FACE_ID)

  # SystemSurfaces: the iPhone host variant that embeds the share extension (LAB-007), the widget
  # and Control extension (LAB-004), and the AUv3 effect extension (LAB-029). Same sources
  # and bundle identifier as LabPhone, so it replaces the CoreLocal app rather than adding one; its
  # own scheme, LabPhone-Surfaces, keeps LabPhone-Core free of App Group provisioning. It and the
  # extension each declare the App Group, derived from LAB_BUNDLE_PREFIX. Simulator builds need no
  # team; on a device the App Group needs a paid team (a free Personal Team cannot use one).
  LabPhoneSurfaces:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Profiles/SystemSurfaces.xcconfig
      Release: Config/Profiles/SystemSurfaces.xcconfig
    sources:
      - Apps/Shared
      # LabPhone's Info.plist is not a resource here; this variant has its own.
      - path: Apps/Phone
        excludes:
          - Info.plist
      - Apps/Icon
      - path: Fixtures/demo/seed.json
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-ambiguous-note.txt
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-injected-note.txt
        buildPhase: resources
      - path: Fixtures/point-inspect/swatch-card.png
        buildPhase: resources
      # LAB-013 Speech Timeline: the sample script the device speaks, and its caption fixture.
      - path: Fixtures/speech/speech-sample-script.txt
        buildPhase: resources
      - path: Fixtures/speech/speech-sample-captions.vtt
      - path: Fixtures/routing/routing-sample-prompt.txt
        buildPhase: resources
    dependencies:
      - package: LabSupport
      - package: LabDomain
      - package: LabStore
      - package: LabFeatures
        product: LabCatalog
      - package: LabFeatures
        product: ActionAtlas
      - package: LabFeatures
        product: ShareIngress
      - package: LabFeatures
        product: TypedIntelligence
      - package: LabFeatures
        product: PointInspect
      - package: LabFeatures
        product: ModelRouting
      - package: LabFeatures
        product: AccessSuperpower
      - package: LabFeatures
        product: WalletMoment
      - package: LabFeatures
        product: PortableObjects
      # LAB-016 Pick Up Here: the same continuation module as LabPhone.
      - package: LabFeatures
        product: PickUpHere
      # LAB-009 Documents Everywhere: sample catalog and previews; Quick Look extension embedded below.
      - package: LabFeatures
        product: DocumentsEverywhere
      # LAB-004 Surface Deck: the deck, its intents, and the snapshot writer, as LabPhone.
      - package: LabFeatures
        product: SurfaceDeck
      # LAB-041 Trust Desk: local authorization, a scoped keychain record, and a passkey simulation.
      - package: LabFeatures
        product: TrustDesk
      # LAB-002 Context Cards: the same module LabPhone links. This host compiles Apps/Shared.
      - package: LabFeatures
        product: ContextCards
      # LAB-015 Local Model Bench: the fixture executor, as LabPhone. It does not link Core ML.
      - package: LabFeatures
        product: LocalModelBench
      # LAB-017 Durable Sync Ledger: the same ledger the iPhone host links.
      - package: LabFeatures
        product: DurableSyncLedger
      # LAB-030 Tactile Grammar: the cues, their fallback, and Play Tactile Cue.
      - package: LabFeatures
        product: TactileGrammar
      # LAB-043 Respectful Attention: the agenda, its intents, and lab-owned alerts.
      - package: LabFeatures
        product: RespectfulAttention
      # LAB-013 Speech Timeline: the timeline, caption import and export, the save operation, and the on-device adapters.
      - package: LabFeatures
        product: SpeechTimeline
      # LAB-006 Find the Thing: opted-in search, citations, and this app's indexed records.
      - package: LabFeatures
        product: FindTheThing
      # LAB-003 Shortcut Workbench: curated App Shortcuts and recipes, as LabPhone.
      - package: LabFeatures
        product: ShortcutWorkbench
      # LAB-032 Render That Survives, as LabPhone.
      - package: LabFeatures
        product: LabJobs
      - package: LabFeatures
        product: RenderThatSurvives
      # LAB-031 Native Screening Room, as LabPhone.
      - package: LabFeatures
        product: ScreeningRoom
      - package: LabFeatures
        product: ScreeningRoomPlayback
      # LAB-029 Audio Workshop, as LabPhone.
      - package: LabFeatures
        product: AudioWorkshop
      # LAB-023 Tabletop Reality, as LabPhone.
      - package: LabFeatures
        product: TabletopReality
      # LAB-019 Local Constellation: the simulation, as LabPhone.
      - package: LabFeatures
        product: PeerSession
      - package: LabFeatures
        product: LocalConstellation
      # LAB-037 Home Scene Sandbox: fictional home preview and selected light commits.
      - package: LabFeatures
        product: HomeSceneSandbox
      # LAB-040 Commerce Without Tricks: local product fixtures and transaction-state simulator.
      - package: LabFeatures
        product: CommerceWithoutTricks
      - target: ShareExtension
        embed: true
      # LAB-004: the widget and Control extension, embedded only in this SystemSurfaces variant.
      - target: SurfaceWidgets
        embed: true
      # LAB-009: Quick Look preview for .anlab; works without the File Provider.
      - target: QuickLookPreview
      # LAB-029: the AUv3 effect extension, embedded only in this SystemSurfaces variant.
      - target: AudioWorkshopUnit
        embed: true
    info:
      path: Extensions/PhoneSurfacesHost/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        LabAppGroupIdentifier: $(LAB_APP_GROUP_IDENTIFIER)
        # LAB-002: the activity type for the sample on screen. Code reads the key, never the prefix.
        LabContextCardsActivityType: $(LAB_BUNDLE_PREFIX).nativelab.context-cards.visible-sample
        # The system delivers an activity type only if it is listed. No entitlement.
        # LAB-016: pick-up-here. LAB-002: the visible sample.
        NSUserActivityTypes:
          - nativelab.pick-up-here
          - $(LAB_BUNDLE_PREFIX).nativelab.context-cards.visible-sample
        # LAB-032: as LabPhone.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).render.*
        # LAB-008 / LAB-009: lab object type for Portable Objects and Quick Look.
        LabObjectTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
            UTTypeDescription: Native Lab Object
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [anlab]
        UILaunchScreen: {}
        # LAB-031: the playback audio session keeps playing in Picture in Picture and in the
        # background, which Picture in Picture on iPhone and iPad requires.
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Extensions/PhoneSurfacesHost/LabPhoneSurfaces.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LAB_APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_NAME: NativeLabSurfaces
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: $(LAB_PURPOSE_SPEECH_RECOGNITION)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: $(LAB_PURPOSE_NEARBY_INTERACTION)
        INFOPLIST_KEY_NSFaceIDUsageDescription: $(LAB_PURPOSE_FACE_ID)
        INFOPLIST_KEY_NSAlarmKitUsageDescription: Apple Native Lab schedules an alarm only after you add one from Respectful Attention.

  # SystemSurfaces: the share extension (LAB-007). It stages what was shared into the App Group
  # folder and finishes; it never opens the store. Embedded only by LabPhoneSurfaces.
  ShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Profiles/SystemSurfaces.xcconfig
      Release: Config/Profiles/SystemSurfaces.xcconfig
    sources:
      - Extensions/ShareExtension
    dependencies:
      - package: LabDomain
      - package: LabFeatures
        product: ShareIngress
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Native Lab Inbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        LabAppGroupIdentifier: $(LAB_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 32
              NSExtensionActivationSupportsMovieWithMaxCount: 32
    entitlements:
      path: Extensions/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LAB_APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.share
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # SystemSurfaces: the widget and Control extension (LAB-004 Surface Deck). It reads the session
  # snapshot the host variant writes into the App Group and nothing else: it never opens the store,
  # composes an operation service, or runs a model. Its toggle and button run App Intents whose
  # perform() needs the app. Embedded only by LabPhoneSurfaces.
  SurfaceWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Profiles/SystemSurfaces.xcconfig
      Release: Config/Profiles/SystemSurfaces.xcconfig
    sources:
      - Extensions/SurfaceWidgets
    dependencies:
      - package: LabDomain
      - package: LabFeatures
        product: SurfaceDeck
    info:
      path: Extensions/SurfaceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Native Lab Surfaces
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        LabAppGroupIdentifier: $(LAB_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/SurfaceWidgets/SurfaceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LAB_APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_NAME: SurfaceWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # SystemSurfaces: Quick Look preview for Native Lab objects (LAB-009). Reads the file URL the
  # system provides and builds the same HTML preview the document browser uses. Needs no File
  # Provider and no App Group. Embedded only by LabPhoneSurfaces.
  QuickLookPreview:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Profiles/SystemSurfaces.xcconfig
      Release: Config/Profiles/SystemSurfaces.xcconfig
    sources:
      - Extensions/QuickLookPreview
    dependencies:
      - package: LabFeatures
        product: DocumentsEverywhere
    info:
      path: Extensions/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: Native Lab Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        LabObjectTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DocumentPreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - $(LAB_BUNDLE_PREFIX).nativelab.object
              - public.json
    entitlements:
      path: Extensions/QuickLookPreview/QuickLookPreview.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_NAME: QuickLookPreview
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.quicklook
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # SystemSurfaces: the AUv3 effect extension (LAB-029 Audio Workshop). A music app loads it as
  # "Native Lab: Workshop Filter" and saves its preset with the app's own project (fullState). It
  # serves the same WorkshopAudioUnit and C kernel the app hosts in-process; it opens no store,
  # writes no file, records nothing, and needs no entitlement. Embedded only by LabPhoneSurfaces,
  # so CoreLocal carries no extension. A Mac AUv3 would need a Mac host variant; none exists yet.
  AudioWorkshopUnit:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Profiles/SystemSurfaces.xcconfig
      Release: Config/Profiles/SystemSurfaces.xcconfig
    sources:
      - Extensions/AudioWorkshopUnit
    dependencies:
      - package: LabFeatures
        product: AudioWorkshop
    info:
      path: Extensions/AudioWorkshopUnit/Info.plist
      properties:
        CFBundleDisplayName: Native Lab Workshop Filter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          NSExtensionAttributes:
            NSExtensionServiceRoleType: NSExtensionServiceRoleTypeEditor
            # Must match WorkshopAudioUnit.componentDescription, componentName, and componentVersion.
            AudioComponents:
              - name: "Native Lab: Workshop Filter"
                description: Workshop Filter
                manufacturer: NLab
                type: aufx
                subtype: wksp
                version: 65536
                sandboxSafe: true
                tags: [Effects]
    settings:
      base:
        PRODUCT_NAME: AudioWorkshopUnit
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.audiounit
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # Companions: the Mac host variant with Local Constellation's local-network adapter (LAB-019).
  # Same sources and bundle identifier as LabMac, so it replaces the CoreLocal app rather than
  # adding one; its own scheme, LabMac-Companions, keeps the network entitlements and the Network
  # framework out of LabMac-Core. Builds and signs to run locally with no team.
  LabMacCompanions:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Apps/Shared
      # LabMac's Info.plist and entitlements are not sources here; this variant has its own.
      - path: Apps/Mac
        excludes:
          - Info.plist
          - LabMac.entitlements
      - Apps/Icon
      # The demo seed, bundled as data. Reset Demo commits it through the operation service.
      - path: Fixtures/demo/seed.json
        buildPhase: resources
      # LAB-010 Typed Local Intelligence: the original fixture notes, bundled as data.
      - path: Fixtures/intelligence/intelligence-ambiguous-note.txt
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-injected-note.txt
        buildPhase: resources
      # LAB-012 Point, Inspect, Propose: the original swatch, bundled as data.
      - path: Fixtures/point-inspect/swatch-card.png
        buildPhase: resources
      # LAB-013 Speech Timeline: the sample script the device speaks, and its caption fixture.
      - path: Fixtures/speech/speech-sample-script.txt
        buildPhase: resources
      - path: Fixtures/speech/speech-sample-captions.vtt
      # LAB-011 Model Routing Observatory: original routing prompt fixture.
      - path: Fixtures/routing/routing-sample-prompt.txt
        buildPhase: resources
    dependencies:
      - package: LabSupport
      - package: LabDomain
      - package: LabStore
      - package: LabFeatures
        product: LabCatalog
      # LAB-001 Action Atlas: App Intents from a package target; their metadata is extracted into the app.
      - package: LabFeatures
        product: ActionAtlas
      # LAB-010 Typed Local Intelligence: typed proposals, the sample parser, and the Foundation Models extractor.
      - package: LabFeatures
        product: TypedIntelligence
      # LAB-012 Point, Inspect, Propose: a chosen image, OCR, and a reviewable record.
      - package: LabFeatures
        product: PointInspect
      # LAB-011 Model Routing Observatory: route policy, PCC eligibility, outgoing-field preview.
      - package: LabFeatures
        product: ModelRouting
      # LAB-035 Access as a Superpower: the task, its chart semantics, and the Audio Graph descriptor.
      - package: LabFeatures
        product: AccessSuperpower
      # LAB-038 Wallet Moment: unsigned pass preview, sample event card, signing boundary (no PassKit link).
      - package: LabFeatures
        product: WalletMoment
      # LAB-007 Share Ingress Station: the share inbox and its paste and file-picker fallbacks.
      - package: LabFeatures
        product: ShareIngress
      # LAB-008 Portable Objects: the .anlab document, its Transferable representations, and staged imports.
      - package: LabFeatures
        product: PortableObjects
      # LAB-016 Pick Up Here: continuation hints. Handoff carries an identifier and a section.
      - package: LabFeatures
        product: PickUpHere
      # LAB-009 Documents Everywhere: sample catalog, previews, and provider lifecycle (provider disabled).
      - package: LabFeatures
        product: DocumentsEverywhere
      # LAB-004 Surface Deck: the demo session's deck, its intents, and the in-app widget previews.
      - package: LabFeatures
        product: SurfaceDeck
      # LAB-042 Desktop Native Power: Mac command palette, documents, and the allowlisted intent.
      - package: LabFeatures
        product: DesktopNativePower
      # LAB-041 Trust Desk: local authorization, a scoped keychain record, and a passkey simulation.
      - package: LabFeatures
        product: TrustDesk
      # LAB-002 Context Cards: the visible sample, the schema gate, and the set-aside intents.
      - package: LabFeatures
        product: ContextCards
      # LAB-015 Local Model Bench: the fixture executor. It does not link Core ML.
      - package: LabFeatures
        product: LocalModelBench
      # LAB-017 Durable Sync Ledger: the write-ahead ledger, the file profile, and the manual document.
      - package: LabFeatures
        product: DurableSyncLedger
      # LAB-030 Tactile Grammar: the cues, their fallback, and Play Tactile Cue.
      - package: LabFeatures
        product: TactileGrammar
      # LAB-043 Respectful Attention: the agenda, its intents, and lab-owned alerts.
      - package: LabFeatures
        product: RespectfulAttention
      # LAB-013 Speech Timeline: the timeline, caption import and export, the save operation, and the on-device adapters.
      - package: LabFeatures
        product: SpeechTimeline
      # LAB-006 Find the Thing: opted-in search, citations, and this app's indexed records.
      - package: LabFeatures
        product: FindTheThing
      # LAB-003 Shortcut Workbench: curated App Shortcuts, recipes, and the manual fallback.
      - package: LabFeatures
        product: ShortcutWorkbench
      # LAB-032 Render That Survives: the reusable job runtime and the render module.
      - package: LabFeatures
        product: LabJobs
      - package: LabFeatures
        product: RenderThatSurvives
      # LAB-031 Native Screening Room: the playback session and its AVFoundation, AVKit, and Now Playing adapters, with the original clips.
      - package: LabFeatures
        product: ScreeningRoom
      - package: LabFeatures
        product: ScreeningRoomPlayback
      # LAB-029 Audio Workshop: the C kernel, live playback, MIDI, offline processing, and the audio unit.
      - package: LabFeatures
        product: AudioWorkshop
      # LAB-023 Tabletop Reality: the kit, placement rules, tracking gate, and anchor operations.
      - package: LabFeatures
        product: TabletopReality
      # LAB-019 Local Constellation: the session layer and the simulation, as the CoreLocal host,
      # and the local-network adapter, only in this Companions variant.
      - package: LabFeatures
        product: PeerSession
      - package: LabFeatures
        product: LocalConstellation
      - package: LabFeatures
        product: PeerSessionNetwork
      # LAB-037 Home Scene Sandbox: fictional home preview and selected light commits.
      - package: LabFeatures
        product: HomeSceneSandbox
      # LAB-040 Commerce Without Tricks: local product fixtures and transaction-state simulator.
      - package: LabFeatures
        product: CommerceWithoutTricks
    info:
      path: Apps/Companions/Mac/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleName: Native Lab
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        # LAB-008: the lab object type, named from the bundle prefix. Code reads the key, never the prefix.
        LabObjectTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
        # LAB-042: Services menu item for selected text. The handler imports the string; it does not run it.
        NSServices:
          - NSMenuItem:
              default: Import Selected Text into Native Lab
            NSMessage: importSelectedText
            NSPortName: Native Lab
            NSSendTypes:
              - public.utf8-plain-text
        # LAB-002: the activity type for the sample on screen. Code reads the key, never the prefix.
        LabContextCardsActivityType: $(LAB_BUNDLE_PREFIX).nativelab.context-cards.visible-sample
        # The system delivers an activity type only if it is listed. No entitlement.
        # LAB-016: pick-up-here. LAB-002: the visible sample.
        NSUserActivityTypes:
          - nativelab.pick-up-here
          - $(LAB_BUNDLE_PREFIX).nativelab.context-cards.visible-sample
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
            UTTypeDescription: Native Lab Object
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [anlab]
        # LAB-019: advertising and browsing for a Local Constellation show. The system may ask
        # only when a person chooses Host or Join.
        NSLocalNetworkUsageDescription: Native Lab hosts or joins a Local Constellation show on your local network only when you choose to.
        NSBonjourServices: [_nativelab-lc._tcp]
    entitlements:
      path: Apps/Companions/Mac/LabMacCompanions.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # LAB-019: Local Constellation's conductor listens and its joiner connects, on the local
        # network only (the adapter excludes cellular and accepts local connections only).
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: NativeLabCompanions
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(LAB_MAC_DEVELOPMENT_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: $(LAB_PURPOSE_SPEECH_RECOGNITION)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSFaceIDUsageDescription: $(LAB_PURPOSE_FACE_ID)

