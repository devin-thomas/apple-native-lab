# Source of truth for AppleNativeLab.xcodeproj. Regenerate with script/generate_project.sh.
# Sources use synchronized folders: add Swift files without regenerating.
#
# Build profiles (docs/BUILD_AND_DISTRIBUTION.md): every target attaches exactly one
# Config/Profiles/<Profile>.xcconfig through `configFiles`, which sets LAB_BUILD_PROFILE and the
# profile's compilation condition. Schemes by profile:
#   CoreLocal         LabMac-Core, LabPhone-Core
#   Companions        LabWatch, LabTV
#   SystemSurfaces    LabPhone-Surfaces (the host variant, the share extension, the widget and Control extension)
#   CloudOptional     none yet
#   FrontierOptional  none yet
# Entitlements and purpose strings are declared per executable, on the target that uses them.
# Every host scheme's test action runs a smoke test inside that host (script/test.sh). The LabWatch
# and LabTV test actions also run the LabSupport and LabCatalog package tests on their platform.
name: AppleNativeLab

options:
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
    tvOS: "26.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  LabSupport:
    path: Packages/LabSupport
  LabDomain:
    path: Packages/LabDomain
  LabStore:
    path: Packages/LabStore
  LabFeatures:
    path: Packages/LabFeatures

targets:
  # CoreLocal: the Mac host. Signs to run locally by default; sandboxed.
  LabMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Profiles/CoreLocal.xcconfig
      Release: Config/Profiles/CoreLocal.xcconfig
    sources:
      - Apps/Shared
      - Apps/Mac
      - Apps/Icon
      # The demo seed, bundled as data. Reset Demo commits it through the operation service.
      - path: Fixtures/demo/seed.json
        buildPhase: resources
      # LAB-010 Typed Local Intelligence: the original fixture notes, bundled as data.
      - path: Fixtures/intelligence/intelligence-ambiguous-note.txt
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-injected-note.txt
        buildPhase: resources
    dependencies:
      - package: LabSupport
      - package: LabDomain
      - package: LabStore
      - package: LabFeatures
        product: LabCatalog
      # LAB-001 Action Atlas: App Intents from a package target; their metadata is extracted into the app.
      - package: LabFeatures
        product: ActionAtlas
      # LAB-010 Typed Local Intelligence: typed proposals, the sample parser, and the Foundation Models extractor.
      - package: LabFeatures
        product: TypedIntelligence
      # LAB-035 Access as a Superpower: the task, its chart semantics, and the Audio Graph descriptor.
      - package: LabFeatures
        product: AccessSuperpower
      # LAB-007 Share Ingress Station: the share inbox and its paste and file-picker fallbacks.
      - package: LabFeatures
        product: ShareIngress
      # LAB-008 Portable Objects: the .anlab document, its Transferable representations, and staged imports.
      - package: LabFeatures
        product: PortableObjects
      # LAB-004 Surface Deck: the demo session's deck, its intents, and the in-app widget previews.
      - package: LabFeatures
        product: SurfaceDeck
      # LAB-030 Tactile Grammar: the cues, their fallback, and Play Tactile Cue.
      - package: LabFeatures
        product: TactileGrammar
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleName: Native Lab
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        # LAB-008: the lab object type, named from the bundle prefix. Code reads the key, never the prefix.
        LabObjectTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
            UTTypeDescription: Native Lab Object
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [anlab]
    # The project's only entitlements. Capability entitlements join the executable that uses them.
    entitlements:
      path: Apps/Mac/LabMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # LAB-008: the Import and Export file dialogs, the declared fallback. Without it the sandbox
        # refuses to show the open and save panels. Access covers only the file a person picks.
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_NAME: NativeLab
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(LAB_MAC_DEVELOPMENT_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: $(LAB_PURPOSE_SPEECH_RECOGNITION)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)

  # CoreLocal: the iPhone and iPad host. It embeds no extension: a SystemSurfaces host variant
  # with its own scheme embeds extensions, so LabPhone-Core never needs their provisioning.
  LabPhone:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Profiles/CoreLocal.xcconfig
      Release: Config/Profiles/CoreLocal.xcconfig
    sources:
      - Apps/Shared
      - Apps/Phone
      - Apps/Icon
      # The demo seed, bundled as data. Reset Demo commits it through the operation service.
      - path: Fixtures/demo/seed.json
        buildPhase: resources
      # LAB-010 Typed Local Intelligence: the original fixture notes, bundled as data.
      - path: Fixtures/intelligence/intelligence-ambiguous-note.txt
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-injected-note.txt
        buildPhase: resources
    dependencies:
      - package: LabSupport
      - package: LabDomain
      - package: LabStore
      - package: LabFeatures
        product: LabCatalog
      # LAB-001 Action Atlas: App Intents from a package target; their metadata is extracted into the app.
      - package: LabFeatures
        product: ActionAtlas
      # LAB-010 Typed Local Intelligence: typed proposals, the sample parser, and the Foundation Models extractor.
      - package: LabFeatures
        product: TypedIntelligence
      # LAB-035 Access as a Superpower: the task, its chart semantics, and the Audio Graph descriptor.
      - package: LabFeatures
        product: AccessSuperpower
      # LAB-007 Share Ingress Station: the share inbox and its paste and file-picker fallbacks.
      - package: LabFeatures
        product: ShareIngress
      # LAB-008 Portable Objects: the .anlab document, its Transferable representations, and staged imports.
      - package: LabFeatures
        product: PortableObjects
      # LAB-004 Surface Deck: the demo session's deck, its intents, and the in-app widget previews.
      - package: LabFeatures
        product: SurfaceDeck
      # LAB-030 Tactile Grammar: the cues, their fallback, and Play Tactile Cue.
      - package: LabFeatures
        product: TactileGrammar
    info:
      path: Apps/Phone/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        # LAB-008: the lab object type, named from the bundle prefix. Code reads the key, never the prefix.
        LabObjectTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(LAB_BUNDLE_PREFIX).nativelab.object
            UTTypeDescription: Native Lab Object
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [anlab]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: NativeLab
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: $(LAB_PURPOSE_SPEECH_RECOGNITION)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: $(LAB_PURPOSE_NEARBY_INTERACTION)

  # SystemSurfaces: the iPhone host variant that embeds the share extension (LAB-007) and the widget
  # and Control extension (LAB-004). Same sources
  # and bundle identifier as LabPhone, so it replaces the CoreLocal app rather than adding one; its
  # own scheme, LabPhone-Surfaces, keeps LabPhone-Core free of App Group provisioning. It and the
  # extension each declare the App Group, derived from LAB_BUNDLE_PREFIX. Simulator builds need no
  # team; on a device the App Group needs a paid team (a free Personal Team cannot use one).
  LabPhoneSurfaces:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Profiles/SystemSurfaces.xcconfig
      Release: Config/Profiles/SystemSurfaces.xcconfig
    sources:
      - Apps/Shared
      # LabPhone's Info.plist is not a resource here; this variant has its own.
      - path: Apps/Phone
        excludes:
          - Info.plist
      - Apps/Icon
      - path: Fixtures/demo/seed.json
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-ambiguous-note.txt
        buildPhase: resources
      - path: Fixtures/intelligence/intelligence-injected-note.txt
        buildPhase: resources
    dependencies:
      - package: LabSupport
      - package: LabDomain
      - package: LabStore
      - package: LabFeatures
        product: LabCatalog
      - package: LabFeatures
        product: ActionAtlas
      - package: LabFeatures
        product: ShareIngress
      - package: LabFeatures
        product: TypedIntelligence
      - package: LabFeatures
        product: AccessSuperpower
      - package: LabFeatures
        product: PortableObjects
      # LAB-004 Surface Deck: the deck, its intents, and the snapshot writer, as LabPhone.
      - package: LabFeatures
        product: SurfaceDeck
      # LAB-030 Tactile Grammar: the cues, their fallback, and Play Tactile Cue.
      - package: LabFeatures
        product: TactileGrammar
      - target: ShareExtension
        embed: true
      # LAB-004: the widget and Control extension, embedded only in this SystemSurfaces variant.
      - target: SurfaceWidgets
        embed: true
    info:
      path: Extensions/PhoneSurfacesHost/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        LabAppGroupIdentifier: $(LAB_APP_GROUP_IDENTIFIER)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Extensions/PhoneSurfacesHost/LabPhoneSurfaces.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LAB_APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_NAME: NativeLabSurfaces
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSCameraUsageDescription: $(LAB_PURPOSE_CAMERA)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: $(LAB_PURPOSE_SPEECH_RECOGNITION)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: $(LAB_PURPOSE_NEARBY_INTERACTION)

  # SystemSurfaces: the share extension (LAB-007). It stages what was shared into the App Group
  # folder and finishes; it never opens the store. Embedded only by LabPhoneSurfaces.
  ShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Profiles/SystemSurfaces.xcconfig
      Release: Config/Profiles/SystemSurfaces.xcconfig
    sources:
      - Extensions/ShareExtension
    dependencies:
      - package: LabDomain
      - package: LabFeatures
        product: ShareIngress
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Native Lab Inbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        LabAppGroupIdentifier: $(LAB_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 32
              NSExtensionActivationSupportsMovieWithMaxCount: 32
    entitlements:
      path: Extensions/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LAB_APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.share
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # SystemSurfaces: the widget and Control extension (LAB-004 Surface Deck). It reads the session
  # snapshot the host variant writes into the App Group and nothing else: it never opens the store,
  # composes an operation service, or runs a model. Its toggle and button run App Intents whose
  # perform() needs the app. Embedded only by LabPhoneSurfaces.
  SurfaceWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Profiles/SystemSurfaces.xcconfig
      Release: Config/Profiles/SystemSurfaces.xcconfig
    sources:
      - Extensions/SurfaceWidgets
    dependencies:
      - package: LabDomain
      - package: LabFeatures
        product: SurfaceDeck
    info:
      path: Extensions/SurfaceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Native Lab Surfaces
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        LabAppGroupIdentifier: $(LAB_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/SurfaceWidgets/SurfaceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LAB_APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_NAME: SurfaceWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # Companions: the Watch host installs directly to a paired Watch; it is not embedded in
  # the iPhone app yet, so CoreLocal never depends on Watch provisioning.
  LabWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Apps/Watch
      - Apps/Icon
    dependencies:
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
      # LAB-030 Tactile Grammar: Watch system haptics only. No custom waveform.
      - package: LabFeatures
        product: TactileGrammar
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(LAB_BUNDLE_PREFIX).nativelab
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
    settings:
      base:
        PRODUCT_NAME: NativeLabWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.watchkitapp
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: $(LAB_PURPOSE_MICROPHONE)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: $(LAB_PURPOSE_NEARBY_INTERACTION)

  # Companions: the Apple TV host (CORE-013). It installs directly to a paired Apple TV. It uses the
  # iPhone host's bundle identifier, as one universal purchase, so a signing team registers no new
  # App ID for it; the TV and iPhone apps never share a device, so the two never collide. It links
  # only LabSupport and LabCatalog, which compile FoundationModels and Speech out of tvOS, and it
  # declares no entitlement. Its icon is the layered tvOS brand asset script/make_app_icon.py draws
  # from the same geometry as Apps/Icon, which Icon Composer does not produce for tvOS.
  LabTV:
    type: application
    platform: tvOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Apps/TV
    dependencies:
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
    info:
      path: Apps/TV/Info.plist
      properties:
        CFBundleDisplayName: Native Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LabSourceRevision: $(LAB_SOURCE_REVISION)
        LabBuildProfile: $(LAB_BUILD_PROFILE)
        LabDistributionLane: $(LAB_DISTRIBUTION_LANE)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
    settings:
      base:
        PRODUCT_NAME: NativeLabTV
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "3"
        # Store lane only: merge purpose strings for the frameworks this host links
        # (Config/PurposeStrings.xcconfig). Source builds keep the Info.plist above unchanged.
        GENERATE_INFOPLIST_FILE: $(LAB_DECLARES_PURPOSE_STRINGS)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: $(LAB_PURPOSE_BLUETOOTH)

  LabMacTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Profiles/CoreLocal.xcconfig
      Release: Config/Profiles/CoreLocal.xcconfig
    sources:
      - Tests/LabMacTests
    dependencies:
      - target: LabMac
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeLab.app/Contents/MacOS/NativeLab
        BUNDLE_LOADER: $(TEST_HOST)
        DEVELOPMENT_TEAM: $(LAB_MAC_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES

  # Smoke tests that run inside each device host (CORE-013), as LabMacTests does for the Mac: the
  # catalog is in the bundle, the build records its provenance, and the readiness probes run
  # without a prompt. script/test.sh runs them in simulators it creates; they never need a team.
  LabPhoneTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Profiles/CoreLocal.xcconfig
      Release: Config/Profiles/CoreLocal.xcconfig
    sources:
      - Tests/LabPhoneTests
    dependencies:
      - target: LabPhone
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.phonetests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeLab.app/NativeLab
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  LabWatchTests:
    type: bundle.unit-test
    platform: watchOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Tests/LabWatchTests
    dependencies:
      - target: LabWatch
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.watchtests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeLabWatch.app/NativeLabWatch
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

  LabTVTests:
    type: bundle.unit-test
    platform: tvOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Tests/LabTVTests
    dependencies:
      - target: LabTV
      - package: LabSupport
      - package: LabFeatures
        product: LabCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.tvtests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeLabTV.app/NativeLabTV
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES

  # The Apple TV host driven with the Siri Remote alone (XCUIRemote): focus reaches the catalog, an
  # experiment's detail, and Readiness, and Menu always leads back, finally to the Home screen.
  LabTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    configFiles:
      Debug: Config/Profiles/Companions.xcconfig
      Release: Config/Profiles/Companions.xcconfig
    sources:
      - Tests/LabTVUITests
    dependencies:
      - target: LabTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_PREFIX).nativelab.tvuitests
        TEST_TARGET_NAME: LabTV
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LabMac-Core:
    build:
      targets:
        LabMac: all
        LabMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LabMacTests
    archive:
      config: Release

  LabPhone-Core:
    build:
      targets:
        LabPhone: all
        LabPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LabPhoneTests
    archive:
      config: Release

  LabPhone-Surfaces:
    build:
      targets:
        LabPhoneSurfaces: all
        ShareExtension: all
        SurfaceWidgets: all
    run:
      config: Debug
    archive:
      config: Release

  LabWatch:
    build:
      targets:
        LabWatch: all
        LabWatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LabWatchTests
        - package: LabSupport/LabSupportTests
        - package: LabFeatures/LabCatalogTests
    archive:
      config: Release

  LabTV:
    build:
      targets:
        LabTV: all
        LabTVTests: [test]
        LabTVUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Only the named screenshots the remote test attaches; no automatic screen captures.
      captureScreenshotsAutomatically: false
      targets:
        - LabTVTests
        - LabTVUITests
        - package: LabSupport/LabSupportTests
        - package: LabFeatures/LabCatalogTests
    archive:
      config: Release
